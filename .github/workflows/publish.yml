name: Publish to PyPI

on:
  push:
    tags: ["v[0-9]*"]

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

env:
  FORCE_COLOR: "1"
  UV_VERSION: "0.12.3"

jobs:
  # CI does not run on tags, so the suite runs here before anything is built.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --locked
      - run: uv run pytest

  build:
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          # A poisoned cache would end up inside a published artifact, so build from scratch.
          enable-cache: false
      - run: uv build
      - name: The tag has to name the version that was built
        env:
          TAG: ${{ github.ref_name }}
        run: test -f "dist/nodrill-${TAG#v}.tar.gz"
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nodrill
    permissions:
      id-token: write  # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Generates PEP 740 attestations by default, which uv publish cannot do yet.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
